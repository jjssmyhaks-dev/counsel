global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "mcp_alerts.yml"

scrape_configs:
  - job_name: "mcp-servers"
    static_configs:
      - targets:
          - "localhost:3100"
          - "localhost:3101"
          - "localhost:3102"
          - "localhost:3103"
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "counsel-api"
    static_configs:
      - targets: ["localhost:3001"]
    metrics_path: "/api/metrics"
    scrape_interval: 10s

  - job_name: "counsel-ai"
    static_configs:
      - targets: ["localhost:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
