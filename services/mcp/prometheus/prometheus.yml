global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "mcp_alerts.yml"

scrape_configs:
  - job_name: "mcp-servers"
    static_configs:
      - targets:
          - "localhost:3100"
          - "localhost:3101"
          - "localhost:3102"
          - "localhost:3103"
          # Tier 2
          - "localhost:3104"
          - "localhost:3105"
          - "localhost:3106"
          - "localhost:3107"
          - "localhost:3108"
          - "localhost:3109"
          - "localhost:3110"
          - "localhost:3111"
          # Tier 3
          - "localhost:3112"
          - "localhost:3113"
          - "localhost:3114"
          - "localhost:3115"
          - "localhost:3116"
          - "localhost:3117"
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "counsel-api"
    static_configs:
      - targets: ["localhost:3001"]
    metrics_path: "/api/metrics"
    scrape_interval: 10s

  - job_name: "counsel-ai"
    static_configs:
      - targets: ["localhost:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
