    restart: unless-stopped
    profiles: ["mcp", "full"]

  # ── Tier 3 — Nice-to-Have ──

  mcp-workflow:
    build: services/mcp
    image: counsel-mcp-workflow
    ports:
      - "3112:3112"
    environment:
      - MCP_SERVER=workflow-mcp
