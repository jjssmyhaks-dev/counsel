      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  mcp-crm:
    build: services/mcp
    image: counsel-mcp-crm
    ports:
      - "3111:3111"
    environment:
      - MCP_SERVER=crm-mcp
      - SALESFORCE_ACCESS_TOKEN=${SALESFORCE_ACCESS_TOKEN}
      - SALESFORCE_INSTANCE_URL=${SALESFORCE_INSTANCE_URL}
      - CLIO_ACCESS_TOKEN=${CLIO_ACCESS_TOKEN}
      - HUBSPOT_ACCESS_TOKEN=${HUBSPOT_ACCESS_TOKEN}
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3111/health"]
      interval: 15s
