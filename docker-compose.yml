# ── Counsel Platform Docker Compose (Full: API + Web + AI + MCP) ──
# Usage: docker compose --profile full up -d

version: "3.9"

services:
  # ──────────── MCP Servers ────────────

  mcp-registry:
    build: services/mcp
    image: counsel-mcp-registry
    ports:
      - "3100:3100"
    environment:
      - MCP_SERVER=registry
    env_file:
      - services/mcp/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3100/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  mcp-postgres:
    build: services/mcp
    image: counsel-mcp-postgres
    ports:
      - "3101:3101"
    environment:
      - MCP_SERVER=postgres-mcp
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3101/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  mcp-cloudflare:
    build: services/mcp
    image: counsel-mcp-cloudflare
    ports:
      - "3102:3102"
    environment:
      - MCP_SERVER=cloudflare-mcp
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3102/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  mcp-document:
    build: services/mcp
    image: counsel-mcp-document
    ports:
      - "3103:3103"
    environment:
      - MCP_SERVER=document-mcp
      - DATABASE_URL=${DATABASE_URL}
      - AI_SERVICE_URL=http://ai:8000
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3103/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  # ── Tier 2 — Required ──

  mcp-email:
