  mcp-video:
    build: services/mcp
    image: counsel-mcp-video
    ports:
      - "3115:3115"
    environment:
      - MCP_SERVER=video-mcp
      - ZOOM_ACCOUNT_ID=${ZOOM_ACCOUNT_ID}
      - ZOOM_CLIENT_ID=${ZOOM_CLIENT_ID}
      - ZOOM_CLIENT_SECRET=${ZOOM_CLIENT_SECRET}
      - MS_GRAPH_TOKEN=${MS_GRAPH_TOKEN}
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3115/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  mcp-time:
    build: services/mcp
    image: counsel-mcp-time
    ports:
      - "3116:3116"
    environment:
      - MCP_SERVER=time-mcp
      - HARVEST_ACCESS_TOKEN=${HARVEST_ACCESS_TOKEN}
      - HARVEST_ACCOUNT_ID=${HARVEST_ACCOUNT_ID}
      - TOGGL_API_TOKEN=${TOGGL_API_TOKEN}
      - TOGGL_WORKSPACE_ID=${TOGGL_WORKSPACE_ID}
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3116/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  mcp-conflict:
    build: services/mcp
    image: counsel-mcp-conflict
    ports:
      - "3117:3117"
    environment:
      - MCP_SERVER=conflict-mcp
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3117/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  # ── CA Vertical MCPs ──

  mcp-gsp:
    build: services/mcp
    image: counsel-mcp-gsp
    ports:
      - "3118:3118"
    environment:
      - MCP_SERVER=gsp-mcp
      - GSP_OAUTH_TOKEN=${GSP_OAUTH_TOKEN}
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3118/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  mcp-mca:
    build: services/mcp
    image: counsel-mcp-mca
    ports:
      - "3119:3119"
    environment:
      - MCP_SERVER=mca-mcp
      - MCA_API_KEY=${MCA_API_KEY}
      - MCA21_API_BASE=${MCA21_API_BASE}
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3119/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  mcp-udin:
    build: services/mcp
    image: counsel-mcp-udin
    ports:
      - "3120:3120"
    environment:
      - MCP_SERVER=udin-mcp
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3120/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  mcp-tally:
    build: services/mcp
    image: counsel-mcp-tally
    ports:
      - "3121:3121"
    environment:
      - MCP_SERVER=tally-mcp
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3121/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  mcp-eri:
    build: services/mcp
    image: counsel-mcp-eri
    ports:
      - "3122:3122"
    environment:
      - MCP_SERVER=eri-mcp
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3122/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  mcp-books:
    build: services/mcp
    image: counsel-mcp-books
    ports:
      - "3123:3123"
    environment:
      - MCP_SERVER=books-mcp
      - ZOHO_OAUTH_TOKEN=${ZOHO_OAUTH_TOKEN}
      - ZOHO_ORGANIZATION_ID=${ZOHO_ORGANIZATION_ID}
      - QUICKBOOKS_ACCESS_TOKEN=${QUICKBOOKS_ACCESS_TOKEN}
      - QUICKBOOKS_REALM_ID=${QUICKBOOKS_REALM_ID}
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3123/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  mcp-whatsapp:
    build: services/mcp
    image: counsel-mcp-whatsapp
    ports:
      - "3124:3124"
    environment:
      - MCP_SERVER=whatsapp-mcp
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
    env_file:
      - services/mcp/.env
    depends_on:
      mcp-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3124/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles: ["mcp", "full"]

  # ──────────── Core Services ────────────

  ai:
    build: services/ai
    ports:
      - "8000:8000"
    env_file:
      - services/ai/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    profiles: ["core", "full"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - apps/api/.env
    depends_on:
      ai:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles: ["core", "full"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env.local
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles: ["core", "full"]

  # ──────────── Monitoring ────────────

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./services/mcp/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./services/mcp/prometheus/mcp_alerts.yml:/etc/prometheus/mcp_alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    profiles: ["monitoring", "full"]

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./services/mcp/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/mcp/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    profiles: ["monitoring", "full"]

  # ──────────── NGINX Reverse Proxy + SSL ────────────

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["production", "full"]

volumes:
  prometheus_data:
  grafana_data:
