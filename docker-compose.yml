  mcp-ocr:
    build: services/mcp
    image: counsel-mcp-ocr
    ports:
      - "3113:3113"
    environment:
      - MCP_SERVER=ocr-mcp
      - AWS_REGION=${AWS_REGION}
      - AZURE_DOCUMENT_INTELLIGENCE_KEY=${AZURE_DOCUMENT_INTELLIGENCE_KEY}
      - AZURE_DOCINTEL_ENDPOINT=${AZURE_DOCINTEL_ENDPOINT}
    env_file:
