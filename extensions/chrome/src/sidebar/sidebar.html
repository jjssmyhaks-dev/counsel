<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counsel — AI Side Panel</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="counsel-sidebar">

    <!-- Header -->
    <div class="counsel-sidebar__header">
      <div class="counsel-sidebar__logo">
        <span class="counsel-sidebar__title">Counsel</span>
      </div>
      <div id="status-indicator" class="counsel-status">
        <span class="counsel-status-dot"></span>
        <span id="status-text">Connecting…</span>
      </div>
    </div>

    <!-- Gmail Integration Panel -->
    <div class="counsel-auth-section" id="gmail-integration-panel">
      <!-- Rendered by JS -->
    </div>

    <!-- Tabs -->
    <div class="counsel-tabs">
      <button class="counsel-tab counsel-tab--active" data-tab="draft">✍️ Draft</button>
      <button class="counsel-tab" data-tab="analyze">🔍 Analyze</button>
      <button class="counsel-tab" data-tab="gmail">📬 Gmail</button>
    </div>

    <!-- Tab: Draft -->
    <div class="counsel-tab-content" id="tab-draft">
      <div class="counsel-card">
        <div class="counsel-form-group">
          <label for="draft-instructions">What would you like to draft?</label>
          <textarea id="draft-instructions" class="counsel-textarea" placeholder="e.g., Draft a polite follow-up email about the contract review…" rows="3"></textarea>
        </div>
        <div class="counsel-form-group">
          <label for="draft-tone">Tone</label>
          <select id="draft-tone" class="counsel-select">
            <option value="professional">Professional</option>
            <option value="concise">Concise</option>
            <option value="persuasive">Persuasive</option>
            <option value="friendly">Friendly</option>
            <option value="formal">Formal</option>
          </select>
        </div>
        <button id="btn-draft-email" class="counsel-btn counsel-btn--primary counsel-btn--full">
          ✨ Draft Email
        </button>
      </div>
      <div id="draft-output" class="counsel-draft-output" style="display:none;"></div>
      <div id="draft-loading" class="counsel-loading" style="display:none;">
        <span class="counsel-spinner"></span>
        Drafting…
      </div>
    </div>

    <!-- Tab: Analyze -->
    <div class="counsel-tab-content" id="tab-analyze" style="display:none;">
      <div class="counsel-card">
        <p class="counsel-text--muted counsel-text--sm">Select text in an email, then choose an action:</p>
        <div class="counsel-analyze-actions">
          <button id="btn-summarize" class="counsel-btn counsel-btn--secondary">📝 Summarize</button>
          <button id="btn-risk" class="counsel-btn counsel-btn--secondary">⚠️ Risk Check</button>
          <button id="btn-clauses" class="counsel-btn counsel-btn--secondary">📋 Clauses</button>
          <button id="btn-actions" class="counsel-btn counsel-btn--secondary">✅ Action Items</button>
        </div>
      </div>
      <div id="analyze-output" class="counsel-analyze-output" style="display:none;"></div>
      <div id="analyze-loading" class="counsel-loading" style="display:none;">
        <span class="counsel-spinner"></span>
        Analyzing…
      </div>
    </div>

    <!-- Tab: Gmail -->
    <div class="counsel-tab-content" id="tab-gmail" style="display:none;">
      <div id="gmail-tab-content">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- Footer -->
    <div class="counsel-sidebar__footer">
      <span id="footer-status" class="counsel-status">API Offline</span>
      <button id="btn-refresh" class="counsel-btn counsel-btn--ghost counsel-btn--sm">🔄 Refresh</button>
    </div>

  </div>

  <script src="sidebar.js"></script>
</body>
</html>
