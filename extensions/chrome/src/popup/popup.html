<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Counsel — Popup</title>
  <style>
    :root { --mint: #15b881; --mint-dark: #0a8a5f; --bg: #fefdfb; --text: #0c0a09; --radius: 6px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 280px; font-family: Inter, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 12px; font-size: 13px; }
    h2 { font-family: Georgia, serif; color: var(--mint-dark); margin-bottom: 10px; font-size: 18px; }
    .btn { display: block; width: 100%; margin: 6px 0; padding: 8px; background: var(--mint); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 600; text-align: left; }
    .btn:hover { background: var(--mint-dark); }
    .btn-secondary { background: #f0ede8; color: var(--text); }
    .btn-secondary:hover { background: #e5e0da; }
    .divider { border-top: 1px solid #e5e0da; margin: 10px 0; }
    .status { font-size: 11px; color: #888; text-align: center; }
  </style>
</head>
<body>
  <h2>Counsel</h2>
  <button class="btn" id="btn-sidebar">📋 Open Side Panel</button>
  <div class="divider"></div>
  <button class="btn btn-secondary" id="btn-dashboard">🏠 Open Dashboard</button>
  <button class="btn btn-secondary" id="btn-settings">⚙️ Settings</button>
  <div class="divider"></div>
  <div id="status" class="status">Checking connection…</div>
  <script src="popup.js"></script>
</body>
</html>
