# ── NGINX Reverse Proxy for Counsel Platform ────────────────────
# With SSL termination, WebSocket upgrade for meetings, Gzip.
#
# SSL setup (one-time):
#   1. Obtain certificates (Let's Encrypt):
#      certbot certonly --standalone -d counsel.yourdomain.com
#   2. Copy to nginx/ssl/:
#      cp /etc/letsencrypt/live/counsel.yourdomain.com/fullchain.pem nginx/ssl/
#      cp /etc/letsencrypt/live/counsel.yourdomain.com/privkey.pem nginx/ssl/
#   3. Set env: NGINX_SERVER_NAME=counsel.yourdomain.com

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting — protect API from abuse
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ── HTTPS Redirect (dev: skip this block) ──
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS Server ──
    server {
        listen 443 ssl http2;
        server_name ${NGINX_SERVER_NAME:-localhost};

        # ──────── SSL ────────
        # For development, generate self-signed certs:
        #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        #     -keyout nginx/ssl/privkey.pem -out nginx/ssl/fullchain.pem
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ──────── Security Headers ────────
        add_header X-Frame-Options         "DENY" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ──────── Next.js Frontend ────────
        location / {
            proxy_pass         http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ──────── Express API ────────
        location /api/ {
            limit_req  zone=api burst=20 nodelay;
            proxy_pass         http://api:3001;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;  # AI calls can be slow
        }

        # ──────── Auth routes (tighter rate limit) ────────
        location /api/v1/auth/ {
            limit_req  zone=login burst=3 nodelay;
            proxy_pass         http://api:3001;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ──────── AI microservice (internal; do not expose) ────────
        # location /agents/ {
        #    proxy_pass http://ai:8000;
        #    ...
        # }
        # NOTE: Commented out — AI service should be internal-only.
        # The Express API already proxies AI calls internally.
    }
}
